## Dev-friendly defaults live in this file so `docker compose up --build` works out of the box.
## See `.env.example` for configuration options.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_ENABLE_DEBUG_LOGS: ${VITE_ENABLE_DEBUG_LOGS:-false}
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    cpus: "0.50"
    mem_limit: 256m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bahnvision-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VALKEY_URL: ${VALKEY_URL:-valkey://valkey:6379/0}
      VALKEY_CACHE_TTL_SECONDS: ${VALKEY_CACHE_TTL_SECONDS:-30}
      VALKEY_CACHE_TTL_NOT_FOUND_SECONDS: ${VALKEY_CACHE_TTL_NOT_FOUND_SECONDS:-15}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-bahnvision}:${POSTGRES_PASSWORD:-bahnvision}@postgres:5432/${POSTGRES_DB:-bahnvision}}
      GTFS_STORAGE_PATH: /data/gtfs
    volumes:
      - gtfs_data:/data/gtfs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    cpus: "1.50"
    mem_limit: 768m

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bahnvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bahnvision}
      POSTGRES_DB: ${POSTGRES_DB:-bahnvision}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bahnvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    cpus: "1.00"
    mem_limit: 512m

  valkey:
    image: valkey/valkey:9.1.0
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "0.50"
    mem_limit: 256m

  postgres-host-access:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    profiles: ["host-access"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 64m

  valkey-host-access:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:6379,fork,reuseaddr", "TCP:valkey:6379"]
    profiles: ["host-access"]
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "${VALKEY_HOST_BIND:-127.0.0.1}:${VALKEY_HOST_PORT:-6379}:6379"
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 64m

  daily-aggregation:
    image: alpine:3.23.4
    env_file:
      - .env
    command: >
      sh -c "
      echo \"0 2 * * * wget -q -O- --header='X-API-Key: $${ADMIN_API_KEY:-}' http://backend:8000/api/v1/heatmap/aggregate-daily --post-data='' >/dev/null 2>&1\" | crontab -
      && crond -f -l 2"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 64m

volumes:
  postgres_data:
  gtfs_data:
